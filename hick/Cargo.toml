[package]
name = "hick"
version = "0.3.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick"
description = "Batteries-included, runtime-agnostic mDNS / DNS-SD: the `mdns-proto` Sans-I/O core wired to a default async driver (tokio & smol)."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming"]
keywords = ["mdns", "dns-sd", "zeroconf", "service-discovery"]
readme = "README.md"

[features]
default = ["tokio"]
# `std` runtimes. Each pulls `mdns-proto/std` (via `std`); the proto core's
# alloc-tier is always on (the `mdns-proto` dependency below enables `alloc`).
tokio = ["std", "hick-reactor/tokio"]
smol = ["std", "hick-reactor/smol"]

compio = ["std", "hick-compio"]

# Synchronous driver: the caller drives its own `mio::Poll` loop. Still a
# `std` driver like `tokio`/`smol`/`compio` above, but no async runtime and no
# extra thread.
mio = ["std", "hick-mio"]

# Enables the `std` build of the proto core. Pulled by the std runtimes above; NOT
# by the bare-metal features, so `default-features = false` + a bare-metal feature
# stays `no_std`.
std = ["mdns-proto/std"]

# Bare-metal (`no_std` + `alloc`) drivers. Each engine has two storage tiers,
# selected by SEPARATE features — Cargo features are additive, so a shared toggle
# could not turn off the `atomic` tier the plain feature enables; the tier is
# encoded in the feature name instead:
#   `smoltcp`  / `embassy`           -> `atomic` tier (SmolStr names + Bytes rdata)
#   `smoltcp-no-atomic` / `embassy-no-atomic`
#                                    -> `no-atomic` tier (portable-atomic `Arc`)
#                                       for cores without native atomic CAS
#                                       (Cortex-M0+ / thumbv6m / RP2040).
# `smoltcp*` exposes the runtime-agnostic engine; `embassy*` adds the embassy-net
# async driver and pulls the matching engine tier. None enable `std`, so they stay
# usable on `no_std` targets. (`stats` implies the `atomic` tier.)
smoltcp = ["hick-smoltcp", "hick-smoltcp/atomic"]
smoltcp-no-atomic = ["hick-smoltcp", "hick-smoltcp/no-atomic"]
embassy = ["hick-embassy", "hick-embassy/atomic", "smoltcp"]
embassy-no-atomic = ["hick-embassy", "hick-embassy/no-atomic", "smoltcp-no-atomic"]

# Forward `tracing` instrumentation. The proto core's `tracing` is no_std-safe
# (the `tracing` crate is pulled with default-features off). The driver
# forwards are WEAK (`?`): they instrument the drivers only when the relevant
# driver feature is already enabled, so `--features embassy,tracing` does NOT
# pull a std driver into a bare-metal build.
tracing = [
  "mdns-proto/tracing",
  "hick-reactor?/tracing",
  "hick-compio?/tracing",
  "hick-mio?/tracing",
  "hick-smoltcp?/tracing",
  "hick-embassy?/tracing",
]
# Forward metrics / stats feature flags across all drivers (same weak-dep
# discipline as `tracing`: bare-metal builds are unaffected).
# `metrics` implies `std` (the `metrics` facade crate requires std) AND
# `stats` (so a metrics-only build still constructs the Stats objects that emit
# the counters — without `stats` the metrics backend is linked but nothing
# ever calls it). Bare-metal observability: use `stats` (+ `defmt`) instead.
metrics = [
  "std",
  "stats",
  "mdns-proto/metrics",
  "hick-reactor?/metrics",
  "hick-compio?/metrics",
  "hick-mio?/metrics",
  # hick-smoltcp and hick-embassy are `no_std` crates; their `metrics` feature
  # was removed because the `metrics` facade requires `std`. Their atomic-only
  # stats are still available via the `stats` feature.
]
# NOTE: `stats` requires the `atomic` tier — `mdns-proto/stats` implies `alloc`, and
# the bare-metal drivers' `stats` implies their `atomic` feature. So combining it
# with a `*-no-atomic` driver re-selects the atomic tier (`alloc`/`std` win backend
# precedence); on a core WITHOUT native atomic CAS (RP2040 / thumbv6m) that cannot
# build (smol_str needs atomics) and fails loudly — same as `metrics` on bare-metal.
# Do not enable `stats` on the no-atomic tier.
stats = [
  "mdns-proto/stats",
  "hick-reactor?/stats",
  "hick-compio?/stats",
  "hick-mio?/stats",
  "hick-smoltcp?/stats",
  "hick-embassy?/stats",
]
# Forward defmt instrumentation to the bare-metal drivers only. mdns-proto has
# no defmt support (its events are tracing-only). The weak-dep (`?`) discipline
# means this never pulls a driver that is not already enabled.
defmt = ["hick-smoltcp?/defmt", "hick-embassy?/defmt"]

[dependencies]
# The proto core is always pulled with `slab` (every driver's pools need it), but
# the storage TIER is NOT fixed here: the `std` runtimes enable `mdns-proto/std`
# and the bare-metal driver features enable the driver's `atomic` / `no-atomic`
# tier (which pulls `mdns-proto/alloc` or `mdns-proto/no-atomic`). Forcing `alloc`
# here would pin the atomic tier and make the `no-atomic` bare-metal path
# impossible — `alloc`/`std` win mdns-proto's backend precedence over `no-atomic`.
mdns-proto = { workspace = true, features = ["slab"] }
hick-reactor = { optional = true, workspace = true }
hick-compio = { optional = true, workspace = true }
hick-mio = { optional = true, workspace = true }
# `default-features = false`: the driver's default `atomic` tier is selected
# explicitly by the facade's `smoltcp` / `embassy` features, leaving the
# `*-no-atomic` features free to select the `no-atomic` tier instead.
hick-smoltcp = { optional = true, workspace = true, default-features = false }
hick-embassy = { optional = true, workspace = true, default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
