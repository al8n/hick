[package]
name = "hick-udp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Sync multicast UDP helpers + interface enumeration for mDNS. Cross-platform shim used by the async wrapper crates."
repository = "https://github.com/al8n/hick"
readme = "README.md"
keywords = ["mdns", "udp", "multicast", "networking"]
categories = ["network-programming"]

[features]
default = []
# Exposes the self-send tracker's clock seams (`take_at`, `seal_at`,
# `record_with_stale_sweep`, `pause_next_seal_for_test`, `len`,
# `anchors_for_test`) plus `RxEvidence::from_stamp_for_test`, so a DEPENDENT
# crate's test binary can place a claim or a loop top without sleeping to it.
# Off by default, so no build a driver ships can hand the tracker a clock
# reading taken somewhere else — production reaches every liveness decision
# through `take`/`seal`, which read the clocks themselves. Belongs in
# `dev-dependencies` only. For the receive stamp this is a speed bump and not a
# boundary: a default build can still assert one through the safe, public
# `RxEvidence::from_cmsgs`, which is a documented caller contract. See its docs.
test-support = []
tracing = ["hick-trace/tracing"]
metrics = ["hick-trace/metrics"]
stats = ["hick-trace/stats"]

[dependencies]
hick-trace.workspace = true
thiserror = { workspace = true, features = ["std"] }
derive_more.workspace = true
getifs.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "system"] }
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Networking_WinSock",
  "Win32_Foundation",
  "Win32_System_IO",
] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
# socket2 is no longer a production dependency on unix (the socket setup moved
# to rustix). The golden-capture parity test still uses it to bind a REUSEPORT
# sniffer joined on the default interface, which the index-based public API
# (try_join_v4) cannot express.
socket2 = { version = "0.6", features = ["all"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
