name: loc

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  pull_request:
    paths-ignore:
      - "README.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.md"
      - "**.txt"
      - "art"
  workflow_dispatch:

jobs:
  # Single job, single gist write. Counting each crate separately (the old
  # matrix) issued one gist PATCH per crate plus one for the workspace total —
  # seven rapid writes to the same gist, which trips GitHub's secondary rate
  # limit. The gists API accepts every file in one PATCH, so collect all the
  # counts first and upload them together.
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Install tokeit
        run: cargo install tokeit --force

      - name: Count lines of code (workspace total + each crate)
        run: |
          set -euo pipefail
          tokeit
          mv tokeit.json loc-hick.json
          for c in mdns-proto hick-onlink hick-udp hick-reactor hick-compio hick-mio hick-smoltcp hick-embassy; do
            ( cd "$c" && tokeit )
            mv "$c/tokeit.json" "loc-$c.json"
          done

      - name: Upload all loc to the gist in one request
        # GitHub does not expose secrets to a `pull_request` run whose head repo
        # is a fork, so `secrets.GIST_PAT` comes through empty there and this
        # step fails every external contribution with "Input required and not
        # supplied: github-token". A fork PR still gets the counting above (the
        # useful half); only the write it cannot authenticate for is skipped.
        # `github.event_name != 'pull_request'` is what lets a push to `main` —
        # which carries no `pull_request` context at all — through unconditionally.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GIST_PAT }}
          script: |
            const fs = require('fs');
            const gistId = '327b2a8aef9003246e45c6e47fe63937';
            // Gist file name -> LoC json. `hick` is the workspace total; the
            // rest are per-crate. These names match the LoC badge URLs in the
            // crate READMEs (…/raw/<name>).
            const crates = [
              'mdns-proto',
              'hick-onlink',
              'hick-udp',
              'hick-reactor',
              'hick-compio',
              'hick-mio',
              'hick-smoltcp',
              'hick-embassy',
            ];
            const files = {
              hick: { content: fs.readFileSync('loc-hick.json', 'utf8') },
            };
            for (const c of crates) {
              files[c] = { content: fs.readFileSync(`loc-${c}.json`, 'utf8') };
            }
            // One PATCH for every file -> no per-crate rate-limit storm.
            await github.rest.gists.update({ gist_id: gistId, files });
