name: CI

on:
  push:
    branches: [main, refactor/sansio]
    paths-ignore:
      - "**.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.txt"
      - "art/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.txt"
      - "art/**"
  workflow_dispatch:
  # Monthly run catches toolchain / dependency drift even with no pushes.
  schedule:
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features --features alloc -- -D warnings
      # Observability feature legs: verify tracing + metrics + stats compile clean.
      - run: cargo clippy --workspace --features tracing,metrics,stats -- -D warnings

  # Native compile coverage on the other two tier-1 host families so the
  # platform `cfg`s (Apple `target_vendor`, Windows) and the `hick-udp/build.rs`
  # capability matrix are exercised, not just Linux.
  os-clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Cross-compile-check the supported non-host targets so a libc-constant /
  # cfg-availability regression is caught before release.
  # FreeBSD covers freebsdlike (incl. DragonFly); NetBSD covers netbsdlike (incl.
  # OpenBSD, which has no rustup std); Android covers the linux_like NDK build.
  # These are the capability families behind `hick-udp/build.rs`.
  #
  # NetBSD is scoped to the sans-io crates (mdns-proto + hick-udp): the
  # hick-reactor tokio driver depends on mio, which does not build on NetBSD —
  # and so does hick-mio, which depends on mio directly rather than through
  # tokio. The NetBSD portability target is the sans-io mechanism + socket
  # layer, not a mio-based policy layer. FreeBSD/Android check the whole
  # workspace.
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            scope: --workspace
          - target: x86_64-unknown-netbsd
            scope: -p mdns-proto -p hick-udp
          - target: aarch64-linux-android
            scope: --workspace
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.scope }} --target ${{ matrix.target }}

  # Bare-metal proof: the `no_std` + `alloc` engine (`hick-smoltcp`) and its
  # embassy driver (`hick-embassy`) must build for a real embedded target. A
  # `no_std` lib also compiles on a `std` host, so the `--workspace` jobs above
  # don't actually exercise the no_std path; this does. `cargo check` doesn't
  # link, so no embedded runtime or cross-linker is required.
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hick-smoltcp -p hick-embassy --target thumbv7em-none-eabihf
      - run: cargo check -p hick-trace --features stats --target thumbv7em-none-eabihf
      # Verify defmt + stats compile together on embedded target.
      - run: cargo check -p hick-smoltcp -p hick-embassy --features defmt,stats --target thumbv7em-none-eabihf
      # Valid bare-metal observability (stats without metrics facade).
      - run: cargo build -p hick --no-default-features --features embassy,stats
      # `mdns-proto` no_std + alloc + stats must check on embedded.
      - run: cargo check -p mdns-proto --no-default-features --features alloc,stats --target thumbv7em-none-eabihf
      # `hick --features embassy,metrics` must FAIL on bare-metal because
      # metrics implies std and the metrics facade requires std. The `!` prefix
      # inverts the exit code so CI fails if the check unexpectedly succeeds.
      - run: "! cargo check -p hick --no-default-features --features embassy,metrics --target thumbv7em-none-eabihf 2>/dev/null"
      # The `mdns-proto` no_std + alloc tier must also build for wasm32 (claimed in
      # its feature-tier table); the thumbv7em check above does not exercise it.
      - run: cargo check -p mdns-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # No-atomic bare-metal tier (issue #40): Cortex-M0+ / thumbv6m-none-eabi
      # (RP2040) has NO native atomic CAS, so the default `atomic` tier — smol_str's
      # `Arc`, bytes' atomic refcount — cannot build there. The `no-atomic` feature
      # swaps the refcounted Name / rdata onto `portable_atomic_util::Arc` (CAS via a
      # `critical-section` impl the binary provides) while keeping the alloc-backed
      # Endpoint. thumbv7em above HAS atomics, so it does not exercise this path.
      - run: cargo check -p mdns-proto --no-default-features --features no-atomic,slab --target thumbv6m-none-eabi
      - run: cargo check -p hick-smoltcp --no-default-features --features no-atomic --target thumbv6m-none-eabi
      - run: cargo check -p hick-embassy --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # The `hick` umbrella crate must also reach the no-atomic tier on thumbv6m
      # (`embassy-no-atomic` pulls `smoltcp-no-atomic` + the driver no-atomic tiers).
      - run: cargo check -p hick --no-default-features --features embassy-no-atomic --target thumbv6m-none-eabi
      # Feature-fence guards for contradictory bare-metal combinations (issue #40
      # review). A featureless `hick` build has no driver and no proto storage tier,
      # so it must fail with the crate's own compile_error (the `!` inverts the exit
      # code, like the `embassy,metrics` guard above).
      - run: "! cargo check -p hick --no-default-features 2>/dev/null"
      # `stats` implies the atomic tier (it needs `alloc`), so combining it with the
      # no-atomic facade tier on thumbv6m must fail loudly — there is no native
      # atomic CAS for `bytes` / `smol_str` (same shape as `embassy,metrics`).
      - run: "! cargo check -p hick --no-default-features --features embassy-no-atomic,stats --target thumbv6m-none-eabi 2>/dev/null"

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # nightly: the crates gate `feature(doc_cfg)` behind `--cfg docsrs`, and
      # that feature (like docs.rs itself) is nightly-only.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --workspace --all-features --no-deps

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack build -p mdns-proto --each-feature
      - run: cargo hack test -p mdns-proto --each-feature

  # Exercise the tracing + stats feature legs in tests so the counters and
  # subscriber wiring are verified on every CI run.
  test-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mdns-proto --features tracing,stats
      - run: cargo test -p mdns-proto --all-features
      - run: cargo test -p hick-reactor --features stats
      # A metrics-only build must compile the stats code (metrics
      # implies stats).  If the implication is missing, `metrics` links the
      # backend but constructs no Stats objects and emits nothing.
      - run: cargo build -p mdns-proto --features metrics
      - run: cargo build -p hick-reactor --features metrics
      # Verify the hick-trace no-op tests run clean (default = no tracing).
      - run: cargo test -p hick-trace
      # hick-mio: `stats` is the only public window into queries_active /
      # packets_rx, and 3 of its 5 loopback integration tests are compiled only
      # under that feature (`#[cfg(feature = "stats")]` on the `#[test]`
      # itself) — a default-feature run would silently skip them, not fail.
      - run: cargo test -p hick-mio --features stats
      - run: cargo build -p hick-mio --features metrics
      # Anti-flake gate for hick-mio's loopback integration tests
      # (hick-mio/tests/loopback.rs). They are deliberately designed to
      # self-skip — print a `skipping:` line and return early — on a host that
      # cannot deliver multicast across its own loopback interface, so a run
      # here is never wrong to *pass* on a skip. But ubuntu-latest reliably
      # delivers loopback multicast, so on THIS runner a `skipping:` line means
      # either a real regression or an intermittent SO_REUSEPORT group
      # misdelivery — both are indistinguishable from "this environment does
      # not deliver" without this check, and both must fail loudly instead of
      # passing green with an assertion that never ran. `--nocapture` is
      # required: the test harness captures stderr (where `skipping:`/`note:`
      # are printed) for a passing test unless asked not to. `note:` lines (the
      # IPv4-only degradation a host with no bindable IPv6 falls back to) are
      # deliberately NOT matched — they weaken no assertion.
      - name: hick-mio loopback tests must not silently self-skip on Linux
        run: |
          # MANDATORY. GitHub's implicit shell is `bash -e {0}`, NOT
          # `bash -eo pipefail` — pipefail is added only when `shell: bash` is
          # set explicitly, and this workflow sets neither `shell:` nor
          # `defaults:`. Without this line the pipeline's exit status is
          # `tee`'s, so a FAILING loopback run exits 0 and only the `skipping:`
          # grep below could fail the job — discarding exactly the flaky
          # SO_REUSEPORT misdelivery this gate exists to catch. Verify with
          # `bash -e -c 'false | tee /dev/null'; echo $?` → 0.
          set -o pipefail
          cargo test -p hick-mio --features stats --test loopback -- --nocapture 2>&1 | tee loopback.log
          if grep -q 'skipping:' loopback.log; then
            echo "::error::hick-mio loopback tests printed 'skipping:' on ubuntu-latest, which reliably delivers loopback multicast. Treat as a regression or an intermittent SO_REUSEPORT misdelivery — never re-run and ignore."
            grep -n 'skipping:' loopback.log
            exit 1
          fi

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test -p mdns-proto --all-features

  bloat-panic-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      - name: Build optimized
        run: cargo build -p mdns-proto --release --all-features
      - name: Scan release symbols for panic landing pads
        run: |
          if cargo bloat --release -n 0 -p mdns-proto 2>&1 | grep -E 'core::panicking::(panic|panic_fmt|panic_bounds_check)' ; then
            echo "::error::Release binary contains panic-landing-pad symbols. mdns-proto must be panic-free."
            exit 1
          fi

  # Multi-platform coverage lives in its own workflow (`coverage.yml`): it runs
  # cargo-llvm-cov on a Linux/macOS/Windows + FreeBSD matrix and merges the
  # per-platform reports into one codecov upload, with the Linux leg as the
  # >= 90% hard gate.
