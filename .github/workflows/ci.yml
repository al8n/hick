name: CI

on:
  push:
    branches: [main, refactor/sansio]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features --features alloc -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features --features heapless -- -D warnings

  # Native compile coverage on the other two tier-1 host families so the
  # platform `cfg`s (Apple `target_vendor`, Windows) and the `mdns-udp/build.rs`
  # capability matrix are exercised, not just Linux.
  os-clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Cross-compile-check the supported non-host targets so a libc-constant /
  # cfg-availability regression is caught before release.
  # FreeBSD covers freebsdlike (incl. DragonFly); NetBSD covers netbsdlike (incl.
  # OpenBSD, which has no rustup std); Android covers the linux_like NDK build.
  # These are the capability families behind `mdns-udp/build.rs`.
  #
  # NetBSD is scoped to the sans-io crates (mdns-proto + mdns-udp): the
  # agnostic-mdns tokio driver depends on mio, which does not build on NetBSD.
  # The NetBSD portability target is the sans-io mechanism + socket layer, not
  # the tokio policy layer. FreeBSD/Android check the whole workspace.
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            scope: --workspace
          - target: x86_64-unknown-netbsd
            scope: -p mdns-proto -p mdns-udp
          - target: aarch64-linux-android
            scope: --workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.scope }} --target ${{ matrix.target }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --workspace --all-features --no-deps

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-hack --locked
      - run: cargo hack build -p mdns-proto --each-feature
      - run: cargo hack test -p mdns-proto --each-feature

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test -p mdns-proto --all-features

  bloat-panic-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-bloat --locked
      - name: Build optimized
        run: cargo build -p mdns-proto --release --all-features
      - name: Scan release symbols for panic landing pads
        run: |
          if cargo bloat --release -n 0 -p mdns-proto 2>&1 | grep -E 'core::panicking::(panic|panic_fmt|panic_bounds_check)' ; then
            echo "::error::Release binary contains panic-landing-pad symbols. mdns-proto must be panic-free."
            exit 1
          fi
