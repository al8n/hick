name: CI

on:
  push:
    branches: [main, refactor/sansio]
    paths-ignore:
      - "**.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.txt"
      - "art/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "COPYRIGHT"
      - "LICENSE*"
      - "**.txt"
      - "art/**"
  workflow_dispatch:
  # Monthly run catches toolchain / dependency drift even with no pushes.
  schedule:
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features -- -D warnings
      - run: cargo clippy -p mdns-proto --no-default-features --features alloc -- -D warnings
      # Observability feature legs: verify tracing + metrics + stats compile clean.
      - run: cargo clippy --workspace --features tracing,metrics,stats -- -D warnings

  # Native compile coverage on the other two tier-1 host families so the
  # platform `cfg`s (Apple `target_vendor`, Windows) and the `hick-udp/build.rs`
  # capability matrix are exercised, not just Linux.
  os-clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Cross-compile-check the supported non-host targets so a libc-constant /
  # cfg-availability regression is caught before release.
  # FreeBSD covers freebsdlike (incl. DragonFly); NetBSD covers netbsdlike (incl.
  # OpenBSD, which has no rustup std); Android covers the linux_like NDK build.
  # These are the capability families behind `hick-udp/build.rs`.
  #
  # `--all-targets` below is load-bearing, not decorative: plain `cargo check`
  # builds only lib + bins, never `#[cfg(test)]` code, so a test-only
  # portability break on these targets was invisible to this job. That was
  # not hypothetical — a test in hick-compio named `libc::IP_PKTINFO`/
  # `in_pktinfo` under a bare `#[cfg(all(unix, test))]`, which FreeBSD's libc
  # does not bind, and this job stayed green through it. The same shape sent
  # `libc::sockaddr_in::sin_len` — a BSD-only field — into a `#[cfg(unix)]`
  # test in PR #72; only an external reviewer caught that one, since macOS
  # (which does run `--all-targets`, see `os-clippy` below) has the field and
  # so could not have.
  #
  # NetBSD is scoped to the sans-io crates (mdns-proto + hick-udp): the
  # hick-reactor tokio driver depends on mio, which does not build on NetBSD —
  # and so does hick-mio, which depends on mio directly rather than through
  # tokio. The NetBSD portability target is the sans-io mechanism + socket
  # layer, not a mio-based policy layer. FreeBSD/Android check the whole
  # workspace. `--all-targets` does not widen that scope, only what gets
  # checked within it: NetBSD stays `-p mdns-proto -p hick-udp`, now including
  # those two crates' test/bench/example targets alongside their libs.
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-freebsd
            scope: --workspace
          - target: x86_64-unknown-netbsd
            scope: -p mdns-proto -p hick-udp
          - target: aarch64-linux-android
            scope: --workspace
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check ${{ matrix.scope }} --all-targets --target ${{ matrix.target }}

  # The first NATIVE execution of this workspace's tests on a BSD. `cross-check`
  # above only COMPILES FreeBSD, so hick-udp's cmsg tests — the whole evidence
  # base behind the BSD IPv4 receive parsers — have until now executed on Linux
  # and macOS only, against those hosts' cmsg ABI. The BSDs are the divergent
  # case: `struct cmsghdr` is 12 bytes there but `CMSG_LEN(0)` rounds it to 16,
  # so an offset or stride taken from the struct instead of from libc's macros
  # is wrong on exactly the targets those parsers exist for. Running here puts
  # the assertions on the layout they were written for.
  #
  # It is no longer only the PARSE. `REQUIRED_TESTS` below now also names the
  # four live tests behind the `has_ip_dstaddr_recvif` capability: the control
  # buffer measurement, and three that bind a real 0.0.0.0:5353 socket through
  # `try_bind_v4` — so through the real `IP_RECVDSTADDR`/`IP_RECVIF` enable and
  # its `getsockopt` read-back — and assert the destination and interface a real
  # kernel reports for a group datagram and for a unicast one. Those are the four
  # numbered evidence items at that cfg's emit site in `hick-udp/build.rs`,
  # executed rather than argued.
  #
  # This is FreeBSD's evidence and no other target's: `IP_RECVIF` is 20 here and
  # 30 on OpenBSD, and `struct sockaddr_dl` has a different trailing shape on
  # each of the four. DragonFly, OpenBSD and NetBSD have no runner anywhere, and
  # what stands in for one there is the on-bind read-back in
  # `verify_rx_dstaddr_recvif_v4`, not this job.
  #
  # GitHub has no FreeBSD runner. `vmactions/freebsd-vm` boots one under QEMU on
  # the ubuntu runner and pipes the script below to `sh` over ssh, failing the
  # step on a non-zero exit. So this job must never be given `continue-on-error`
  # (nor the action's `debug-on-error`, which swallows the throw): a VM that
  # cannot run the tests has to be red, not green.
  #
  # Plain `cargo test`, NOT cargo-llvm-cov. Instrumenting inside the guest needs
  # rustup for `llvm-tools-preview` (FreeBSD's `rust` package does not carry the
  # component) plus a from-source `cargo install cargo-llvm-cov`, since
  # taiki-e/install-action neither runs in the VM nor has a FreeBSD binary to
  # fetch — a long, fragile build for a coverage percentage. What is missing on
  # this platform is execution, not a number, and that is what this buys.
  freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege for the one job that runs a runtime-downloaded provisioner
    # on this runner (see the supply-chain note below). Nothing here writes to
    # the repository.
    permissions:
      contents: read
    env:
      # TWO lists, each read twice — once inside the guest and once on the runner
      # after copyback. Keeping one copy of each is what stops the two checks
      # drifting into disagreeing about what counts as evidence.
      #
      # WHY TWO, and it is the difference between "returned" and "concluded".
      # libtest prints `test <name> ... ok` for a test that RETURNED. A test that
      # returned early because a precondition was unmet — no loopback, a refused
      # join, a send that failed — prints exactly the same line as one that
      # asserted, so for any test with an environmental precondition that line
      # proves only that the process started. That is the shape of two defects
      # already fixed in this workspace.
      #
      # REQUIRED_TESTS are pure unit tests over synthesized buffers. They have no
      # preconditions and no output, so `... ok` and "concluded" are the same
      # claim and the status line is sufficient. They must STAY silent: anything
      # they print lands mid-line under --nocapture and the exact-match below
      # stops finding them.
      REQUIRED_TESTS: >-
        synth_cmsg_agrees_with_libc_on_payload_offset_and_stride
        cmsg_iter_is_sound_on_crafted_and_unaligned_input
        cmsg_iter_fuses_after_malformed_header
        parses_ipv4_ttl_cmsg
        parses_ipv6_hoplimit_cmsg
        parses_scm_timestamp
        decode_recvdstaddr_reads_a_network_order_in_addr
        decode_recvif_index_reads_sdl_index_out_of_the_fixed_prefix
        scan_dstaddr_recvif_skips_unrelated_cmsgs_and_recovers_both
        reports_rx_interface_v4_names_every_supported_target
        a_dstaddr_without_recvif_declines_the_interface_and_keeps_the_destination
      # REQUIRED_EVIDENCE are the tests that touch a real socket, and they are the
      # four numbered evidence items behind `has_ip_dstaddr_recvif` plus the pin
      # on the production read-back's call site. Every unmet precondition in them
      # is now FATAL rather than an early return, and each emits
      # `hick-udp-evidence-complete: <name>` as its last statement, after every
      # assertion. This job requires that MARKER and not the status line, so a
      # test that returns without concluding cannot report success. (It is not a
      # defence against a hostile branch, which could print the line directly —
      # see the supply-chain note below for what this job does and does not
      # establish.)
      REQUIRED_EVIDENCE: >-
        control_buffer_holds_every_cmsg_this_target_enables
        bsd_ipv4_bind_enables_the_receive_metadata_pair
        bsd_ipv4_recv_witnesses_the_group_and_a_unicast_destination
        bsd_ipv4_recv_witnesses_the_interface_that_carried_the_datagram
        try_bind_v4_rejects_a_half_enabled_socket_forced_through_production_wiring
      # HARNESS_LOG and RUN_NONCE are deliberately NOT set here. They are minted
      # per run by the step below and published through $GITHUB_ENV, because a
      # value written in this file is a value a branch can predict.
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole tree is rsynced into the VM, and the push side of that
          # rsync excludes `_actions` and `_PipelineMapping` but NOT `.git` — so
          # a token left in `.git/config` would be handed straight to the guest.
          persist-credentials: false

      # The evidence log has to be something THIS run produced. Without that,
      # the host-side check below verifies a file rather than a test run: the
      # log lives at a repository-relative path, so a branch could simply commit
      # one containing the nine passing lines, and a VM step that returned
      # success without executing anything would leave that file in place to be
      # accepted.
      - name: Mint this run's evidence nonce and refuse a pre-seeded log
        shell: bash
        run: |
          set -euo pipefail

          # A committed file at this path is not something to clean up silently
          # — nothing legitimately produces one before the VM runs, so its
          # presence is the signal, and it fails the job.
          shopt -s nullglob
          seeded=(freebsd-harness*.log)
          if [ ${#seeded[@]} -gt 0 ]; then
            echo "::error::the checkout contains ${seeded[*]}. That path is reserved for the log the FreeBSD VM writes during this run and must never be committed."
            exit 1
          fi

          # Unpredictable at commit time, which is the entire point: a file
          # written into the tree cannot carry a value minted here. This is not
          # a secret and needs no masking — it only has to be unknown to whoever
          # wrote the branch. It goes in the FILENAME as well as the contents so
          # that even the path cannot be guessed and pre-created.
          nonce="$(openssl rand -hex 32)"
          log="freebsd-harness-$nonce.log"
          test ! -e "$log"
          {
            echo "RUN_NONCE=$nonce"
            echo "HARNESS_LOG=$log"
          } >> "$GITHUB_ENV"

      - name: cargo test -p hick-udp natively on FreeBSD
        # Pinned to an immutable commit rather than the moving `v1`. This action
        # boots the VM, ships the tree into it, and decides whether the guest's
        # exit status ever reaches the runner — so the guest's own `set -eu`
        # cannot defend against the action changing underneath us, and a full
        # SHA is the only reference GitHub does not let anyone move. Audited at
        # this SHA: `runSSHOnce` spawns `ssh <host> sh` with the script on stdin
        # and resolves the child's exit code (a signal-killed ssh becomes 1, not
        # 0); `execSSH` returns only on 0 and throws otherwise; the `run` call
        # site asks for no retries and no timeout and rethrows unless
        # `debug-on-error` is set, which this job must never set. That throw
        # ends at `core.setFailed`, so a failing guest script fails the step.
        #
        # SUPPLY CHAIN, stated plainly rather than implied: that SHA is not the
        # whole chain. At it, the action fetches `anyvm.py` at runtime from
        # `anyvm-org/anyvm` at the tag `v0.5.1` named in its own bundled conf,
        # and a git tag is movable — it is not a SHA. That script runs ON THIS
        # RUNNER and performs the workspace synchronisation, so a compromised or
        # changed AnyVM CAN FORGE THE EVIDENCE LOG outright: it can write the
        # nine passing lines, the summary, and this run's nonce — which it sees,
        # since the action hands that nonce to the guest — without ever booting
        # FreeBSD. Nothing in this job detects that, and no host-side check can,
        # because the untrusted code runs on the host too.
        #
        # WHAT THIS MECHANISM ESTABLISHES, scoped precisely so the next reader
        # does not take it for more than it is. The nonce, the host-side check
        # and the refusal of a pre-seeded log detect ACCIDENTAL non-execution:
        # a VM that never booted, a guest that skipped the harness, a copyback
        # that returned nothing, a stale log committed to the tree, an
        # infrastructure failure that would otherwise report green. Those are
        # the failures this job exists to catch, and it catches them.
        #
        # It is NOT resistant to a hostile branch, and nothing at this layer
        # could make it so. The branch under test owns `build.rs`, the
        # dependency graph, the Cargo configuration, the test sources — and this
        # workflow file. It can print whatever it likes into the output the
        # shell later stamps with the nonce, or leave the nine test names in
        # place while hollowing them out until they assert nothing and still
        # print `... ok`. The log would then be a truthful record of tests
        # deliberately made vacuous. Keeping the nonce and the log path out of
        # Cargo's environment below removes the laziest version of that — a
        # build script appending a correct nonce line — but it does not change
        # the conclusion. Reading the diff is what covers a hostile branch. CI
        # is not, and this guard should never be cited as though it were.
        #
        # Nor does any of it defeat a HOSTILE AnyVM, per the paragraph above.
        # What bounds both is blast radius: `permissions: contents: read` and no
        # persisted credentials, so the worst case is a false green rather than
        # a write to the repository.
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          # Must name a conf file bundled in the action: resolution is a literal
          # `conf/<release>.conf` lookup with no branch-to-latest step, so a
          # bare "14" aborts the step. Pinning the action pins that set too, so
          # a SHA bump means re-checking this value.
          release: "14.4"
          usesh: true
          # The workspace is rsynced back so the runner can verify the log, and
          # copyback is whole-tree with no path filter — hence CARGO_TARGET_DIR
          # below, which keeps the build tree out of what gets copied.
          copyback: true
          # The VM is a separate machine, so this job's `env:` block does not
          # reach it; these get there through this hand-off and nowhere else.
          envs: "RUSTFLAGS RUST_BACKTRACE REQUIRED_TESTS REQUIRED_EVIDENCE HARNESS_LOG RUN_NONCE"
          prepare: |
            pkg install -y rust
          run: |
            set -eu
            if [ -z "${RUSTFLAGS-}" ]; then
              echo "::error::RUSTFLAGS did not reach the VM; this build would allow warnings"
              exit 1
            fi
            # Take copies and drop the originals from the environment before
            # the FIRST cargo invocation of any kind, so nothing in the build —
            # build scripts, proc macros, dependencies, the tests themselves —
            # is ever handed the nonce or the evidence path. `set -u` makes a
            # later reference to either name an error rather than an empty
            # string.
            nonce="$RUN_NONCE"
            final_log="$HARNESS_LOG"
            required="$REQUIRED_TESTS"
            required_evidence="$REQUIRED_EVIDENCE"
            unset RUN_NONCE HARNESS_LOG REQUIRED_TESTS REQUIRED_EVIDENCE

            freebsd-version
            rustc --version
            cargo --version

            # Both halves of the colour setting matter, and only because the
            # checks compare whole lines: CARGO_TERM_COLOR governs cargo,
            # `--color never` governs the test harness that actually prints
            # them, and either left on would wrap `ok` in ANSI escapes that no
            # exact match can see past.
            export CARGO_TERM_COLOR=never
            # Out of the synced tree, or copyback drags gigabytes of build
            # artifacts back to the runner. /var/tmp, not /tmp, because it is
            # disk-backed on FreeBSD.
            export CARGO_TARGET_DIR=/var/tmp/hick-udp-target

            # Cargo's output goes somewhere cargo is never told about, outside
            # the synced tree, so a build script cannot find the file by
            # globbing the workspace. The evidence log does not exist yet.
            raw_log=/var/tmp/hick-udp-harness.raw

            # Build first so compile output streams, then capture the harness
            # output. Piping into `tee` instead would report `tee`'s status and
            # hide a failing run.
            # --nocapture so the completion markers reach the log at all:
            # libtest swallows a PASSING test's output otherwise, which is
            # exactly the case the markers exist for. --test-threads=1 because
            # --nocapture interleaves output from concurrent tests into each
            # other's lines, and both checks below are whole-line exact matches.
            # It also makes the thread-local test seams (FORCE_APPLIED_HOPS_V6,
            # FORCE_RX_DSTADDR_READBACK_V4) share one thread, which each test
            # already handles by resetting before it asserts.
            cargo test -p hick-udp --all-features --no-run
            if ! cargo test -p hick-udp --all-features --no-fail-fast -- --color never --nocapture --test-threads=1 >"$raw_log" 2>&1; then
              cat "$raw_log"
              exit 1
            fi

            # Cargo has exited. The shell — not the build — writes the nonce
            # line and assembles the log into the workspace for copyback.
            {
              printf 'freebsd-run-nonce: %s\n' "$nonce"
              cat "$raw_log"
            } > "$final_log"
            cat "$final_log"

            # Defence in depth only — the authoritative copy of this check runs
            # on the runner, for the reason given above. Failing here just
            # surfaces the problem next to the output that caused it.
            for t in $required; do
              if ! grep -Fqx "test multicast::tests::$t ... ok" "$final_log"; then
                echo "::error::hick-udp test $t did not run and pass on FreeBSD"
                exit 1
              fi
            done
            for t in $required_evidence; do
              if ! grep -Fqx "hick-udp-evidence-complete: $t" "$final_log"; then
                echo "::error::hick-udp evidence test $t did not reach its completion marker on FreeBSD"
                exit 1
              fi
            done

      # The authoritative evidence check, deliberately OUTSIDE the VM. An action
      # that reports success without executing anything leaves this log absent,
      # empty, or without this run's nonce, and each of those has to be as red
      # as a failing assertion — so they are checked separately and none is
      # allowed to pass.
      #
      # Whole-line exact matches, because a bare name proves nothing: `#[ignore]`
      # prints `test <name> ... ignored, <reason>` and still exits 0 — this crate
      # has such a test — and a rename to `<name>_v2` leaves the old name a
      # substring of the new one.
      - name: Verify on the runner that FreeBSD really executed the cmsg tests
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -e "$HARNESS_LOG" ]; then
            echo "::error::$HARNESS_LOG did not come back from the VM. Either the guest never wrote it or the VM step reported success without running the tests."
            exit 1
          fi
          if [ ! -s "$HARNESS_LOG" ]; then
            echo "::error::$HARNESS_LOG came back empty, so nothing was executed in the VM."
            exit 1
          fi
          # Proves the file was produced during this run rather than shipped in
          # the tree: the value did not exist when the branch was written.
          if ! grep -Fqx "freebsd-run-nonce: $RUN_NONCE" "$HARNESS_LOG"; then
            echo "::error::$HARNESS_LOG does not carry this run's nonce, so it is not the log this run's VM wrote."
            exit 1
          fi
          # An empty list would make the loop below iterate zero times and pass
          # vacuously, which is the same green-with-no-evidence outcome.
          if [ -z "${REQUIRED_TESTS// /}" ]; then
            echo "::error::REQUIRED_TESTS is empty; there is no evidence list to check."
            exit 1
          fi
          if [ -z "${REQUIRED_EVIDENCE// /}" ]; then
            echo "::error::REQUIRED_EVIDENCE is empty; there is no evidence list to check."
            exit 1
          fi

          if grep -q '^test result: FAILED' "$HARNESS_LOG"; then
            echo "::error::a FreeBSD test binary reported failures."
            grep -n '^test result: FAILED' "$HARNESS_LOG"
            exit 1
          fi
          if ! grep -q '^test result: ok\.' "$HARNESS_LOG"; then
            echo "::error::no 'test result: ok.' summary in $HARNESS_LOG; no test binary ran to completion."
            exit 1
          fi

          missing=0
          # Word splitting is the point: both lists are space-separated.
          # shellcheck disable=SC2086
          for t in $REQUIRED_TESTS; do
            if ! grep -Fqx "test multicast::tests::$t ... ok" "$HARNESS_LOG"; then
              echo "::error::hick-udp test $t did not run and pass on FreeBSD"
              missing=1
            fi
          done
          # The status line above says a test RETURNED. For the tests that touch
          # a real socket that is not the same claim as "concluded", so those are
          # checked by the marker each emits after its last assertion instead.
          # shellcheck disable=SC2086
          for t in $REQUIRED_EVIDENCE; do
            if ! grep -Fqx "hick-udp-evidence-complete: $t" "$HARNESS_LOG"; then
              echo "::error::hick-udp evidence test $t did not reach its completion marker on FreeBSD. It either failed, was skipped, or returned early before asserting — the four evidence items behind has_ip_dstaddr_recvif are not established by this run."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "FreeBSD executed every required cmsg test:"
          for t in $REQUIRED_TESTS; do echo "  ok  $t"; done
          echo "FreeBSD concluded every required evidence test:"
          for t in $REQUIRED_EVIDENCE; do echo "  done  $t"; done

  # Bare-metal proof: the `no_std` + `alloc` engine (`hick-smoltcp`) and its
  # embassy driver (`hick-embassy`) must build for a real embedded target. A
  # `no_std` lib also compiles on a `std` host, so the `--workspace` jobs above
  # don't actually exercise the no_std path; this does. `cargo check` doesn't
  # link, so no embedded runtime or cross-linker is required.
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hick-smoltcp -p hick-embassy --target thumbv7em-none-eabihf
      - run: cargo check -p hick-trace --features stats --target thumbv7em-none-eabihf
      # Verify defmt + stats compile together on embedded target.
      - run: cargo check -p hick-smoltcp -p hick-embassy --features defmt,stats --target thumbv7em-none-eabihf
      # Valid bare-metal observability (stats without metrics facade).
      - run: cargo build -p hick --no-default-features --features embassy,stats
      # `mdns-proto` no_std + alloc + stats must check on embedded.
      - run: cargo check -p mdns-proto --no-default-features --features alloc,stats --target thumbv7em-none-eabihf
      # `hick --features embassy,metrics` must FAIL on bare-metal because
      # metrics implies std and the metrics facade requires std. The `!` prefix
      # inverts the exit code so CI fails if the check unexpectedly succeeds.
      - run: "! cargo check -p hick --no-default-features --features embassy,metrics --target thumbv7em-none-eabihf 2>/dev/null"
      # The `mdns-proto` no_std + alloc tier must also build for wasm32 (claimed in
      # its feature-tier table); the thumbv7em check above does not exercise it.
      - run: cargo check -p mdns-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # No-atomic bare-metal tier (issue #40): Cortex-M0+ / thumbv6m-none-eabi
      # (RP2040) has NO native atomic CAS, so the default `atomic` tier — smol_str's
      # `Arc`, bytes' atomic refcount — cannot build there. The `no-atomic` feature
      # swaps the refcounted Name / rdata onto `portable_atomic_util::Arc` (CAS via a
      # `critical-section` impl the binary provides) while keeping the alloc-backed
      # Endpoint. thumbv7em above HAS atomics, so it does not exercise this path.
      - run: cargo check -p mdns-proto --no-default-features --features no-atomic,slab --target thumbv6m-none-eabi
      - run: cargo check -p hick-smoltcp --no-default-features --features no-atomic --target thumbv6m-none-eabi
      - run: cargo check -p hick-embassy --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # The `hick` umbrella crate must also reach the no-atomic tier on thumbv6m
      # (`embassy-no-atomic` pulls `smoltcp-no-atomic` + the driver no-atomic tiers).
      - run: cargo check -p hick --no-default-features --features embassy-no-atomic --target thumbv6m-none-eabi
      # Feature-fence guards for contradictory bare-metal combinations (issue #40
      # review). A featureless `hick` build has no driver and no proto storage tier,
      # so it must fail with the crate's own compile_error (the `!` inverts the exit
      # code, like the `embassy,metrics` guard above).
      - run: "! cargo check -p hick --no-default-features 2>/dev/null"
      # `stats` implies the atomic tier (it needs `alloc`), so combining it with the
      # no-atomic facade tier on thumbv6m must fail loudly — there is no native
      # atomic CAS for `bytes` / `smol_str` (same shape as `embassy,metrics`).
      - run: "! cargo check -p hick --no-default-features --features embassy-no-atomic,stats --target thumbv6m-none-eabi 2>/dev/null"

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # nightly: the crates gate `feature(doc_cfg)` behind `--cfg docsrs`, and
      # that feature (like docs.rs itself) is nightly-only.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo doc --workspace --all-features --no-deps

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack build -p mdns-proto --each-feature
      - run: cargo hack test -p mdns-proto --each-feature

  # Exercise the tracing + stats feature legs in tests so the counters and
  # subscriber wiring are verified on every CI run.
  test-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mdns-proto --features tracing,stats
      - run: cargo test -p mdns-proto --all-features
      - run: cargo test -p hick-reactor --features stats
      # A metrics-only build must compile the stats code (metrics
      # implies stats).  If the implication is missing, `metrics` links the
      # backend but constructs no Stats objects and emits nothing.
      - run: cargo build -p mdns-proto --features metrics
      - run: cargo build -p hick-reactor --features metrics
      # Verify the hick-trace no-op tests run clean (default = no tracing).
      - run: cargo test -p hick-trace
      # hick-mio: `stats` is the only public window into queries_active /
      # packets_rx, and 3 of its 5 loopback integration tests are compiled only
      # under that feature (`#[cfg(feature = "stats")]` on the `#[test]`
      # itself) — a default-feature run would silently skip them, not fail.
      - run: cargo test -p hick-mio --features stats
      - run: cargo build -p hick-mio --features metrics
      # The maximal leg for both socket-layer crates. Every feature either owns
      # has is an observability one (`tracing` / `metrics` / `stats`), so
      # `--all-features` here IS this job's subject rather than an extra scope:
      # for hick-mio it is a strict superset of the `stats` run above (`metrics`
      # implies `stats`) that additionally compiles the `tracing` instrumentation
      # into every test, and hick-udp has no other axis at all. Running them here
      # rather than in a job of their own keeps one warm dependency graph and one
      # cargo cache, and keeps every hick-mio test invocation beside the
      # `skipping:` gate below that protects them.
      #
      # `--test-threads=1` is deliberately NOT passed. Both of hick-mio's socket-
      # binding suites serialise themselves: the unit tests hold `socket.rs`'s
      # crate-wide `BIND_LOCK` for the whole lifetime of each fixture, and
      # `tests/loopback.rs` funnels every endpoint through its own `bind_lock`.
      # Nothing beyond an ordinary unprivileged runner is needed either — binding
      # UDP 5353 on `lo` and joining 224.0.0.251 takes no capability the
      # `--test loopback` step above does not already rely on.
      - run: cargo test -p hick-mio --all-features
      - run: cargo test -p hick-udp --all-features
      # Anti-flake gate for hick-mio's loopback integration tests
      # (hick-mio/tests/loopback.rs). They are deliberately designed to
      # self-skip — print a `skipping:` line and return early — on a host that
      # cannot deliver multicast across its own loopback interface, so a run
      # here is never wrong to *pass* on a skip. But ubuntu-latest reliably
      # delivers loopback multicast, so on THIS runner a `skipping:` line means
      # either a real regression or an intermittent SO_REUSEPORT group
      # misdelivery — both are indistinguishable from "this environment does
      # not deliver" without this check, and both must fail loudly instead of
      # passing green with an assertion that never ran. `--nocapture` is
      # required: the test harness captures stderr (where `skipping:`/`note:`
      # are printed) for a passing test unless asked not to. `note:` lines (the
      # IPv4-only degradation a host with no bindable IPv6 falls back to) are
      # deliberately NOT matched — they weaken no assertion.
      - name: hick-mio loopback tests must not silently self-skip on Linux
        run: |
          # MANDATORY. GitHub's implicit shell is `bash -e {0}`, NOT
          # `bash -eo pipefail` — pipefail is added only when `shell: bash` is
          # set explicitly, and this workflow sets neither `shell:` nor
          # `defaults:`. Without this line the pipeline's exit status is
          # `tee`'s, so a FAILING loopback run exits 0 and only the `skipping:`
          # grep below could fail the job — discarding exactly the flaky
          # SO_REUSEPORT misdelivery this gate exists to catch. Verify with
          # `bash -e -c 'false | tee /dev/null'; echo $?` → 0.
          set -o pipefail
          cargo test -p hick-mio --features stats --test loopback -- --nocapture 2>&1 | tee loopback.log
          if grep -q 'skipping:' loopback.log; then
            echo "::error::hick-mio loopback tests printed 'skipping:' on ubuntu-latest, which reliably delivers loopback multicast. Treat as a regression or an intermittent SO_REUSEPORT misdelivery — never re-run and ignore."
            grep -n 'skipping:' loopback.log
            exit 1
          fi

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test -p mdns-proto --all-features

  bloat-panic-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      - name: Build optimized
        run: cargo build -p mdns-proto --release --all-features
      - name: Scan release symbols for panic landing pads
        run: |
          if cargo bloat --release -n 0 -p mdns-proto 2>&1 | grep -E 'core::panicking::(panic|panic_fmt|panic_bounds_check)' ; then
            echo "::error::Release binary contains panic-landing-pad symbols. mdns-proto must be panic-free."
            exit 1
          fi

  # Multi-platform coverage lives in its own workflow (`coverage.yml`): it runs
  # cargo-llvm-cov on a Linux/macOS/Windows matrix plus a linux-musl leg and
  # merges the per-platform reports into one codecov upload, with the Linux leg
  # as the >= 90% hard gate. FreeBSD is absent from it on purpose — the
  # `freebsd` job above executes those tests instead of instrumenting them.
