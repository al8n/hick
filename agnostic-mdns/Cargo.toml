[package]
name = "agnostic-mdns"
version = "0.6.0"
edition = "2024"
publish = false
repository = "https://github.com/al8n/agnostic-mdns"
homepage = "https://github.com/al8n/agnostic-mdns"
documentation = "https://docs.rs/agnostic-mdns"
description = "Async mDNS driver layered on `mdns-proto` + `mdns-udp`, runtime-agnostic via `agnostic-net` (tokio & smol)."
license = "MIT OR Apache-2.0"
rust-version = "1.85.0"
categories = ["network-programming"]
keywords = ["mdns", "dns-sd", "zeroconf", "agnostic", "async-mdns"]
readme = "README.md"

[features]
default = ["tokio"]
tokio = ["agnostic-net/tokio"]
smol = ["agnostic-net/smol"]
# Forward to `mdns-proto`'s `tracing` feature so callers can opt in.
# The driver itself already emits `tracing::debug!` on socket errors
# regardless of this feature; turning it on additionally surfaces the
# proto-layer trace points (Endpoint::handle, observe_send, Service::poll,
# etc.) at trace/debug levels.
tracing = ["mdns-proto/tracing"]

[dependencies]
mdns-proto = { workspace = true, features = ["std", "slab"] }
mdns-udp = { path = "../mdns-udp" }
agnostic-net = { version = "0.2" }
agnostic-lite = { version = "0.5" }
async-channel = "2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getifs = "0.6"
pin-project-lite = "0.2"
rand = "0.8"
slab = "0.4"
smol_str = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
agnostic-net = { version = "0.2", features = ["tokio", "smol"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
tokio = { version = "1", features = ["full"] }
smol = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
