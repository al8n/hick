[package]
name = "hick-compio"
version = "0.1.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick-compio"
description = "compio-native async mDNS driver (responder + querier + DNS-SD discovery), thread-per-core."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming", "asynchronous"]
keywords = ["mdns", "dns-sd", "zeroconf", "compio"]
readme = "README.md"

[features]
default = []
tracing = ["dep:tracing", "mdns-proto/tracing", "hick-trace/tracing"]
metrics = ["stats", "mdns-proto/metrics", "hick-trace/metrics"]
stats = ["mdns-proto/stats", "hick-trace/stats"]

[dependencies]
bytes = { workspace = true, features = ["default"] }
mdns-proto = { workspace = true, features = ["std", "slab"] }
hick-udp.workspace = true
hick-trace.workspace = true
tracing = { workspace = true, optional = true, features = ["attributes", "std"] }
compio = { version = "0.19", features = ["time"] }
compio-net = "0.12"
compio-io = "0.10"
compio-runtime = "0.12"
compio-buf = "0.8.2"
futures = { workspace = true, features = ["std", "async-await"] }
event-listener = "5"
getifs.workspace = true
slab = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
thiserror = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
compio = { version = "0.19", features = ["macros", "time"] }
getifs.workspace = true
tracing-core.workspace = true
ctor.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
