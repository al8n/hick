[package]
name = "hick-compio"
version = "0.1.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick-compio"
description = "compio-native async mDNS driver (responder + querier + DNS-SD discovery), thread-per-core."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming", "asynchronous"]
keywords = ["mdns", "dns-sd", "zeroconf", "compio"]
readme = "README.md"

[features]
default = []
tracing = ["dep:tracing", "mdns-proto/tracing", "hick-trace/tracing"]
metrics = ["stats", "mdns-proto/metrics", "hick-trace/metrics"]
stats = ["mdns-proto/stats", "hick-trace/stats"]

[dependencies]
mdns-proto = { workspace = true, features = ["std", "slab"] }
hick-udp.workspace = true
hick-trace = { workspace = true }
tracing = { workspace = true, optional = true, features = ["attributes", "std"] }
compio = { version = "0.19", features = ["time"] }
compio-net = "0.12"
compio-io = "0.10"
compio-runtime = "0.12"
compio-buf = "0.8.2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
event-listener = "5"
getifs = "0.6"
slab = "0.4"
smol_str = "0.3"
rand = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
compio = { version = "0.19", features = ["macros", "time"] }
# Pin the loopback interface in the end-to-end driver integration tests.
getifs = "0.6"
# Always-enabled subscriber installed before the unit-test run (see trace_cov)
# so the instrumentation call sites evaluate their fields and earn coverage.
tracing-core = "0.1"
ctor = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
