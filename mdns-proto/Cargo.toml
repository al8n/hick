[package]
name = "mdns-proto"
version = "0.2.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Sans-I/O mDNS protocol state machines (no_std, no_alloc capable, panic-free)."
repository = "https://github.com/al8n/hick"
readme = "README.md"
keywords = ["mdns", "no-std", "sans-io", "embedded", "dns"]
categories = ["network-programming", "no-std", "embedded"]

[features]
default = ["std", "slab"]
std = ["smol_str/std", "rand/std", "thiserror/std", "bytes/std"]
alloc = ["dep:smol_str", "dep:rand", "dep:bytes"]
slab = ["dep:slab"]
heapless = ["dep:heapless"]
tracing = ["hick-trace/tracing"]
metrics = ["std", "stats", "hick-trace/metrics"]
stats = ["hick-trace/stats", "alloc"]

test-no-panic = []

[dependencies]
thiserror = { workspace = true }
derive_more = { workspace = true }
rand_core = { workspace = true }
smol_str = { workspace = true, optional = true }
bytes = { version = "1", default-features = false, optional = true }
rand = { workspace = true, features = ["std_rng"], optional = true }
slab = { workspace = true, optional = true }
heapless = { version = "0.9", optional = true }
hick-trace = { workspace = true }

[dev-dependencies]
rand_core = { workspace = true }
proptest = "1"
no-panic = "0.1"
rand = { workspace = true, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
slab = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
tracing-core = { workspace = true }
ctor = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
