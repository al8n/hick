[package]
name = "hick-embassy"
version = "0.1.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick-embassy"
description = "Async mDNS / DNS-SD for embassy: the `hick-smoltcp` engine driven on embassy-net + embassy-time. `no_std` + `alloc`."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming", "embedded", "asynchronous"]
keywords = ["mdns", "dns-sd", "embassy", "smoltcp", "zeroconf"]
readme = "README.md"

[features]
default = []
tracing = ["mdns-proto/tracing", "hick-smoltcp/tracing", "hick-trace/tracing"]
metrics = ["mdns-proto/metrics", "hick-smoltcp/metrics", "hick-trace/metrics"]
stats = ["mdns-proto/stats", "hick-smoltcp/stats", "hick-trace/stats"]
defmt = ["dep:defmt", "hick-smoltcp/defmt"]

[dependencies]
hick-trace = { workspace = true }
mdns-proto = { workspace = true, features = ["alloc", "slab"] }
hick-smoltcp = { workspace = true }
defmt = { workspace = true, optional = true }
embassy-net = { version = "0.9", default-features = false, features = [
  "udp",
  "multicast",
  "proto-ipv4",
  "proto-ipv6",
  "medium-ethernet",
] }
embassy-time = { version = "0.5", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
# Seeded RNG for the handle-API tests (matches hick-smoltcp's test RNG).
rand = "0.10"
# A time driver so `Instant::now()` and `Timer` work in unit tests (the
# production build leaves the driver to the embedded app). `std` is test-only.
# `generic-queue-8` is the self-contained timer queue, so `Timer` works under
# `futures::block_on` without the embassy-executor's integrated queue glue.
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
# `block_on` to drive the async run loop inline in the Stack-harness tests.
futures = { version = "0.3", features = ["executor"] }

[lints]
workspace = true
