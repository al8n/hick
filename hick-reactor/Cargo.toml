[package]
name = "hick-reactor"
version = "0.2.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick-reactor"
description = "Async mDNS driver layered on `mdns-proto` + `hick-udp`, runtime-agnostic via `agnostic-net` (tokio & smol)."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming"]
keywords = ["mdns", "dns-sd", "zeroconf", "agnostic", "async-mdns"]
readme = "README.md"

[features]
default = ["tokio"]
tokio = ["agnostic-net/tokio"]
smol = ["agnostic-net/smol"]

tracing = ["dep:tracing", "mdns-proto/tracing", "hick-trace/tracing"]
metrics = ["stats", "mdns-proto/metrics", "hick-trace/metrics"]
stats = ["mdns-proto/stats", "hick-trace/stats"]

[dependencies]
bytes = { workspace = true, features = ["default"] }
mdns-proto = { workspace = true, features = ["std", "slab"] }
hick-udp.workspace = true
hick-trace.workspace = true
tracing = { workspace = true, optional = true, features = [
  "attributes",
  "std",
] }
agnostic-net = { version = "0.3" }
agnostic-lite = { version = "0.7" }
async-channel = "2"
futures = { workspace = true, features = ["std", "async-await"] }
getifs.workspace = true
pin-project-lite = "0.2"
rand = { workspace = true, features = [
  "std",
  "std_rng",
  "sys_rng",
  "thread_rng",
] }
slab = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
agnostic-net = { version = "0.3", features = ["tokio", "smol"] }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "tracing-log",
] }
tracing-core.workspace = true
ctor.workspace = true
tokio = { version = "1", features = ["full"] }
smol = "2"
getifs.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
