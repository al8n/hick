[package]
name = "hick-reactor"
version = "0.3.0"
edition = "2024"
publish = true
repository = "https://github.com/al8n/hick"
homepage = "https://github.com/al8n/hick"
documentation = "https://docs.rs/hick-reactor"
description = "Async mDNS driver layered on `mdns-proto` + `hick-udp`, runtime-agnostic via `agnostic-net` (tokio & smol)."
license = "MIT OR Apache-2.0"
rust-version = "1.91.0"
categories = ["network-programming"]
keywords = ["mdns", "dns-sd", "zeroconf", "agnostic", "async-mdns"]
readme = "README.md"

[features]
default = ["tokio"]
tokio = ["agnostic-net/tokio"]
smol = ["agnostic-net/smol"]

tracing = ["dep:tracing", "mdns-proto/tracing", "hick-trace/tracing"]
metrics = ["stats", "mdns-proto/metrics", "hick-trace/metrics"]
stats = ["mdns-proto/stats", "hick-trace/stats"]

[dependencies]
bytes = { workspace = true, features = ["default"] }
mdns-proto = { workspace = true, features = ["std", "slab"] }
hick-udp.workspace = true
hick-trace.workspace = true
tracing = { workspace = true, optional = true, features = [
  "attributes",
  "std",
] }
agnostic-net = { version = "0.4" }
agnostic-lite = { version = "0.7" }
async-channel = "2"
futures = { workspace = true, features = ["std", "async-await"] }
getifs.workspace = true
pin-project-lite = "0.2"
rand = { workspace = true, features = [
  "std",
  "std_rng",
  "sys_rng",
  "thread_rng",
] }
slab = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# The self-send tracker's clock seams (`take_at`, `seal_at`, `len`) are behind
# `test-support`, so a test can place a claim or a loop top without sleeping to
# it. Dev-only on purpose: no shipped build of this crate can hand the tracker a
# reading taken anywhere but inside its own decision.
hick-udp = { workspace = true, features = ["test-support"] }
agnostic-net = { version = "0.4", features = ["tokio", "smol"] }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "tracing-log",
] }
tracing-core.workspace = true
ctor.workspace = true
tokio = { version = "1", features = ["full"] }
smol = "2"
getifs.workspace = true
# The Bonjour parity test proves, before trusting any premise, that an mDNS
# round trip actually crosses the interface it is about to bind. That control
# socket must not share hick's own socket layer, or a defect there would make
# the control and the code under test fail together and read as a host problem.
libc.workspace = true
# The independent control sockets in `tests/loopback_lookup.rs` and
# `tests/loopback_endpoint.rs` each have to do two things `std::net` cannot
# express — set `SO_REUSEADDR`/`SO_REUSEPORT` before binding `:5353`, and select
# an interface for multicast EGRESS — and have to do them on Windows as well as
# Unix, or that platform has no control and can only
# skip on faith. socket2 is independent of THIS crate's driver, which is the
# property a control needs, and it sizes every option itself rather than making
# a caller choose a C type by hand.
socket2 = { version = "0.6", features = ["all"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
